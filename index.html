<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A responsive, accessible login form interface study.">
  <title>Login Form — Interface Preview</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="login-container">
    <div class="logo" aria-hidden="true">H</div>
    <p class="eyebrow">INTERFACE PREVIEW</p>
    <h1>Welcome back</h1>
    <p class="intro">Enter your details to try the form.</p>
    <form id="loginForm">
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="username" required maxlength="254">
      <label for="password">Password</label>
      <div class="password-field">
        <input type="password" id="password" name="password" autocomplete="current-password" required aria-describedby="demo-note">
        <button type="button" id="show-password" aria-controls="password" aria-pressed="false">Show</button>
      </div>
      <button type="submit" class="submit">Check form</button>
      <p id="form-status" role="status" aria-live="polite"></p>
    </form>
    <p class="demo-note" id="demo-note">This is a UI preview. No account is checked, and your details are not sent or saved.</p>
  </main>
</body>
</html>
